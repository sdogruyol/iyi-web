name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, iyi ${{ matrix.iyi }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # The oldest iyi this release supports (README, Requirements), and
        # the latest.
        iyi: ["0.18.0", latest]
        # Windows on the latest only.
        exclude:
          - os: windows-2025
            iyi: "0.18.0"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Empty installs the latest release.
      IYI_VERSION: ${{ matrix.iyi != 'latest' && matrix.iyi || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install iyi
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/iyilang/iyi/master/install.sh | IYI_PREFIX="$HOME/.iyi" sh
          echo "$HOME/.iyi/bin" >> "$GITHUB_PATH"

      # iyi links through the Visual C++ build tools, which the runner has.
      - name: Install iyi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:IYI_PREFIX = Join-Path $env:RUNNER_TEMP 'iyi'
          irm https://raw.githubusercontent.com/iyilang/iyi/master/install.ps1 | iex
          Join-Path $env:IYI_PREFIX 'bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: iyi version

      - name: Test
        run: iyi test iyi_web

      - name: Build the examples
        run: |
          for example in examples/*.iyi; do
            case "$example" in *_test.iyi) continue ;; esac
            echo "building $example"
            iyi build "$example" -o "$RUNNER_TEMP/example"
          done

      - name: Test the examples
        run: iyi test examples

  # What the next tag has to be called, from what the exported surface did
  # since the last one: an export gone is a new minor before v1 and a new
  # major after, and a pull request that makes one says so here. On the
  # latest iyi.
  surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, which the surface is compared against.
          fetch-depth: 0

      - name: Install iyi
        run: |
          curl -fsSL https://raw.githubusercontent.com/iyilang/iyi/master/install.sh | IYI_PREFIX="$HOME/.iyi" sh
          echo "$HOME/.iyi/bin" >> "$GITHUB_PATH"

      - name: What the next release has to be
        run: iyi mod release
