site_name: iyi-web
site_description: The web framework for iyi
site_url: https://sdogruyol.github.io/iyi-web/
repo_url: https://github.com/sdogruyol/iyi-web
repo_name: sdogruyol/iyi-web
edit_uri: edit/master/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      # iyi's syntax is Crystal's, and .eiy templates are ERB.
      extend_pygments_lang:
        - name: iyi
          lang: crystal
        - name: eiy
          lang: erb
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Getting started:
      - Installation: installation.md
      - The iyi-web command: cli.md
  - Guide:
      - Routing: routing.md
      - Parameters: parameters.md
      - Typed routes: typed-routes.md
      - Requests and responses: requests-and-responses.md
      - Errors: errors.md
      - Routers: routers.md
      - Templates: templates.md
      - Static files: static-files.md
      - Sessions and CSRF: sessions-and-csrf.md
      - WebSockets and SSE: websockets-and-sse.md
      - Middleware: middleware.md
      - Security: security.md
      - OpenAPI: openapi.md
      - Dependencies and auth: dependencies-and-auth.md
      - Every core: every-core.md
      - Shared state with Store: state.md
      - Lifecycle and background tasks: lifecycle-and-background.md
      - Observability: observability.md
      - Databases: database.md
      - Transport: transport.md
      - Configuration: configuration.md
      - Testing: testing.md
      - Deployment: deployment.md
      - Writing a plugin: plugins.md
  - Reference:
      - Modules: modules.md
  - Benchmarks: benchmarks.md
  - Changelog: https://github.com/sdogruyol/iyi-web/blob/master/CHANGELOG.md
